# profile.yml: everything on the profile README comes from this file.
# Edit it, run `make build`, check `make preview`, then `make ship`.
# The order of items here is the order on the page.

user: frimpongopoku

hero:
  name: Frimpong Opoku Agyemang
  thesis: Engineer first. AI is the multiplier.
  intro: >-
    I've shipped Swift, React Native, TypeScript, Python and PHP since 2017,
    so I know how these systems work and where they break. That's why AI
    makes me faster: I design the system, direct the agents, catch what
    they get wrong and fix it myself.
  # The sidebar in the hero terminal. state: run | done | wait | me
  agents:
    - { label: architecture, tag: me, state: me }
    - { label: mac-app · swift, tag: build, state: run }
    - { label: storefront · web, tag: tests, state: run }
    - { label: mobile · expo, tag: build, state: run }
    - { label: spec-writer, tag: done, state: done }
    - { label: code review, tag: me, state: wait }

badges:
  - { label: ships in, value: Swift · TypeScript · Python, color: f2b632 }
  - { label: multiplied by, value: Claude Code · Cursor · Cline, color: c9a2ff }
  - { label: engineer at, value: MassEnergize, color: 3fa66b, url: "https://www.massenergize.org" }
  - { label: founder, value: Biibisoft, color: d4603a, url: "https://biibisoft.com" }
  - { label: web, value: mrfrimpong.com, color: 6aa9ff, url: "https://www.mrfrimpong.com" }

multiplier:
  lede: >-
    AI only multiplies what you already know. I've built these systems by hand
    across four platforms, so I can tell good output from plausible output and
    fix the difference myself. The engineering decisions stay with me. Agents
    take the volume.
  own:
    - System architecture and data models
    - Auth, security and payments (Mobile Money, bank)
    - Performance work, like on-device video encoding
    - Debugging the problems agents can't see
    - Review of every diff before it merges
  speeds_up:
    - Scaffolding and boilerplate
    - Test coverage
    - Refactors that touch dozens of files
    - Porting a feature across platforms
    - Docs and first drafts of specs
  loop: [SPEC.md, architecture, CLAUDE.md, parallel agents, review + ship]
  toolkit: [Claude Code, Cursor, Cline, MCP, LLM APIs]
  # Static stats. Repo and language counts are fetched live at build time.
  platforms: 4
  platforms_note: macOS, mobile, web, backend

