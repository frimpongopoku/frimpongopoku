# profile.yml: everything on the profile README comes from this file.
# Edit it, run `make build`, check `make preview`, then `make ship`.
# The order of items here is the order on the page.

user: frimpongopoku

hero:
  name: Frimpong Opoku Agyemang
  thesis: One engineer. A fleet of agents.
  intro: >-
    I run AI agents in parallel at every stage of a build: spec, code,
    tests, review. I keep the architecture and the judgment calls. That's
    how one person ships Mac apps, mobile apps, SaaS platforms and data
    pipelines.
  # The sidebar in the hero terminal. state: run | done | wait | me
  agents:
    - { label: you are here, tag: me, state: me }
    - { label: mac-app · swift, tag: build, state: run }
    - { label: storefront · web, tag: tests, state: run }
    - { label: mobile · expo, tag: build, state: run }
    - { label: spec-writer, tag: done, state: done }
    - { label: reviewer, tag: waiting, state: wait }

badges:
  - { label: builds with, value: Claude Code · Cursor · Cline, color: f2b632 }
  - { label: engineer at, value: MassEnergize, color: 3fa66b, url: "https://www.massenergize.org" }
  - { label: founder, value: Biibisoft, color: d4603a, url: "https://github.com/Biibisoft" }
  - { label: web, value: mrfrimpong.com, color: 6aa9ff, url: "https://www.mrfrimpong.com" }

multiplier:
  lede: >-
    AI writes most of the first drafts. I set the direction, keep the context
    in order, and review everything before it ships. Every project starts as a
    spec and a rules file, so the agents build to a plan.
  toolkit:
    - { name: Claude Code, does: "main driver: parallel sessions, one per workstream" }
    - { name: Cursor, does: in-editor edits and fast refactors }
    - { name: Cline, does: agentic tasks inside VS Code }
    - { name: MCP, does: "agents wired into docs, data and services" }
    - { name: LLM APIs, does: "RAG, embeddings and generation inside the products themselves" }
  loop:
    - { step: SPEC.md, does: product spec and designs, written first }
    - { step: CLAUDE.md, does: "house rules: stack, style, limits" }
    - { step: MEMORY + REGISTRY, does: agents keep a map of features and files }
    - { step: parallel agents, does: one per platform or feature }
    - { step: review + ship, does: I read every diff before it merges }
  # Static stats. Repo and language counts are fetched live at build time.
  platforms: 4
  platforms_note: macOS, mobile, web, backend

